<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUAR Engine Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: #4cc9f0;
    }
    #ar-canvas {
      width: 640px;
      height: 480px;
      background: #16213e;
      border: 2px solid #4cc9f0;
      border-radius: 8px;
    }
    #status {
      margin-top: 20px;
      padding: 10px 20px;
      background: #16213e;
      border-radius: 4px;
      font-family: monospace;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #60a5fa; }
    button {
      margin-top: 20px;
      padding: 10px 30px;
      background: #4cc9f0;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #7dd3fc;
    }
    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }
    #debug {
      margin-top: 20px;
      padding: 15px;
      background: #16213e;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre;
      max-width: 640px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>QUAR WebAR Engine Test</h1>
  <canvas id="ar-canvas" width="640" height="480"></canvas>
  <div id="status" class="info">Loading WASM module...</div>
  <button id="start-btn" disabled>Start Tracking</button>
  <div id="debug">
QUAR Engine Debug Info
----------------------
Version: loading...
State: initializing
FPS: --
Features: --
  </div>

  <script type="module">
    // Import the WASM module (built with wasm-pack)
    import init, { greet, version, EngineConfig } from '../pkg/quar_engine.js';

    const canvas = document.getElementById('ar-canvas');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const debug = document.getElementById('debug');

    function setStatus(message, type = 'info') {
      status.textContent = message;
      status.className = type;
    }

    function updateDebug(info) {
      debug.textContent = `QUAR Engine Debug Info
----------------------
Version: ${info.version || '--'}
State: ${info.state || '--'}
FPS: ${info.fps || '--'}
Features: ${info.features || '--'}`;
    }

    async function main() {
      try {
        // Initialize WASM module
        await init();

        // Get version from WASM
        const ver = version();
        setStatus(`WASM module loaded! Version: ${ver}`, 'success');

        // Test the greet function
        const greeting = greet('Developer');
        console.log(greeting);

        // Create config
        const config = new EngineConfig();
        console.log('Default config:', {
          targetFPS: config.target_fps,
          adaptiveQuality: config.adaptive_quality,
          debug: config.debug,
        });

        updateDebug({
          version: ver,
          state: 'ready',
          fps: '60',
          features: '0',
        });

        startBtn.disabled = false;

      } catch (error) {
        setStatus(`Error loading WASM: ${error.message}`, 'error');
        console.error('WASM initialization error:', error);
      }
    }

    startBtn.addEventListener('click', () => {
      setStatus('Tracking started!', 'success');
      startBtn.textContent = 'Tracking...';
      startBtn.disabled = true;

      updateDebug({
        version: version(),
        state: 'tracking',
        fps: '60',
        features: '150',
      });
    });

    main();
  </script>
</body>
</html>
