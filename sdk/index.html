<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUAR Engine Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: #4cc9f0;
    }
    #ar-canvas {
      width: 640px;
      height: 480px;
      background: #16213e;
      border: 2px solid #4cc9f0;
      border-radius: 8px;
    }
    #status {
      margin-top: 20px;
      padding: 10px 20px;
      background: #16213e;
      border-radius: 4px;
      font-family: monospace;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #60a5fa; }
    .warning { color: #fbbf24; }
    button {
      margin-top: 20px;
      padding: 10px 30px;
      background: #4cc9f0;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #7dd3fc;
    }
    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }
    #debug {
      margin-top: 20px;
      padding: 15px;
      background: #16213e;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre;
      max-width: 640px;
      width: 100%;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>QUAR WebAR Engine Test</h1>
  <canvas id="ar-canvas" width="640" height="480"></canvas>
  <div id="status" class="info">Click "Start Camera" to begin</div>
  <div class="button-group">
    <button id="start-btn">Start Camera</button>
    <button id="switch-btn" disabled>Switch Camera</button>
    <button id="stop-btn" disabled>Stop</button>
  </div>
  <div id="debug">
QUAR Engine Debug Info
----------------------
State: waiting
Camera: --
FPS: --
Resolution: --
  </div>

  <script type="module">
    // Import the SDK (we'll use a simple inline version for testing)
    // In production, you'd import from the built SDK

    const canvas = document.getElementById('ar-canvas');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const switchBtn = document.getElementById('switch-btn');
    const stopBtn = document.getElementById('stop-btn');
    const debug = document.getElementById('debug');

    // Simple camera manager for testing (inline version)
    class TestCameraManager {
      constructor() {
        this.video = null;
        this.stream = null;
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.animationId = null;
        this.facingMode = 'environment';
        this.fps = 0;
        this.frameCount = 0;
        this.lastFpsTime = 0;
      }

      async start() {
        try {
          this.video = document.createElement('video');
          this.video.setAttribute('playsinline', '');
          this.video.muted = true;
          this.video.autoplay = true;

          const constraints = {
            video: {
              facingMode: { ideal: this.facingMode },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          };

          this.stream = await navigator.mediaDevices.getUserMedia(constraints);
          this.video.srcObject = this.stream;

          await new Promise((resolve) => {
            this.video.onloadedmetadata = resolve;
          });

          await this.video.play();
          this.startRenderLoop();

          return {
            width: this.video.videoWidth,
            height: this.video.videoHeight
          };
        } catch (err) {
          throw err;
        }
      }

      startRenderLoop() {
        const render = () => {
          if (!this.video) return;

          // Update FPS
          this.frameCount++;
          const now = performance.now();
          if (now - this.lastFpsTime >= 1000) {
            this.fps = this.frameCount;
            this.frameCount = 0;
            this.lastFpsTime = now;
          }

          // Draw video to canvas
          const videoAspect = this.video.videoWidth / this.video.videoHeight;
          const canvasAspect = this.canvas.width / this.canvas.height;

          let drawWidth, drawHeight, offsetX, offsetY;

          if (videoAspect > canvasAspect) {
            drawHeight = this.canvas.height;
            drawWidth = this.canvas.height * videoAspect;
            offsetX = (this.canvas.width - drawWidth) / 2;
            offsetY = 0;
          } else {
            drawWidth = this.canvas.width;
            drawHeight = this.canvas.width / videoAspect;
            offsetX = 0;
            offsetY = (this.canvas.height - drawHeight) / 2;
          }

          this.ctx.drawImage(this.video, offsetX, offsetY, drawWidth, drawHeight);

          this.animationId = requestAnimationFrame(render);
        };

        this.animationId = requestAnimationFrame(render);
      }

      async switchCamera() {
        this.facingMode = this.facingMode === 'environment' ? 'user' : 'environment';
        this.stop();
        return await this.start();
      }

      stop() {
        if (this.animationId) {
          cancelAnimationFrame(this.animationId);
          this.animationId = null;
        }
        if (this.stream) {
          this.stream.getTracks().forEach(track => track.stop());
          this.stream = null;
        }
        if (this.video) {
          this.video.srcObject = null;
          this.video = null;
        }
        this.ctx.fillStyle = '#16213e';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      }

      getDebugInfo() {
        return {
          fps: this.fps,
          facingMode: this.facingMode,
          resolution: this.video
            ? `${this.video.videoWidth}x${this.video.videoHeight}`
            : '--'
        };
      }
    }

    let camera = new TestCameraManager();
    let debugInterval = null;

    function setStatus(message, type = 'info') {
      status.textContent = message;
      status.className = type;
    }

    function updateDebug() {
      const info = camera.getDebugInfo();
      debug.textContent = `QUAR Engine Debug Info
----------------------
State: ${camera.video ? 'tracking' : 'stopped'}
Camera: ${info.facingMode}
FPS: ${info.fps}
Resolution: ${info.resolution}`;
    }

    startBtn.addEventListener('click', async () => {
      try {
        setStatus('Requesting camera access...', 'info');
        startBtn.disabled = true;

        const resolution = await camera.start();

        setStatus(`Camera active: ${resolution.width}x${resolution.height}`, 'success');
        switchBtn.disabled = false;
        stopBtn.disabled = false;

        debugInterval = setInterval(updateDebug, 500);

      } catch (err) {
        console.error('Camera error:', err);

        if (err.name === 'NotAllowedError') {
          setStatus('Camera permission denied. Please allow camera access.', 'error');
        } else if (err.name === 'NotFoundError') {
          setStatus('No camera found on this device.', 'error');
        } else {
          setStatus(`Camera error: ${err.message}`, 'error');
        }

        startBtn.disabled = false;
      }
    });

    switchBtn.addEventListener('click', async () => {
      try {
        setStatus('Switching camera...', 'info');
        switchBtn.disabled = true;

        const resolution = await camera.switchCamera();

        setStatus(`Camera switched: ${resolution.width}x${resolution.height}`, 'success');
        switchBtn.disabled = false;

      } catch (err) {
        setStatus(`Switch failed: ${err.message}`, 'error');
        switchBtn.disabled = false;
      }
    });

    stopBtn.addEventListener('click', () => {
      camera.stop();
      clearInterval(debugInterval);

      setStatus('Camera stopped', 'warning');
      startBtn.disabled = false;
      switchBtn.disabled = true;
      stopBtn.disabled = true;

      updateDebug();
    });

    // Initial debug display
    updateDebug();
  </script>
</body>
</html>
