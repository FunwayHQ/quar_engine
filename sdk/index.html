<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUAR Engine - Tracking Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; color: #4cc9f0; }
    .subtitle { color: #888; margin-bottom: 20px; font-size: 14px; }
    .canvas-container { position: relative; }
    #ar-canvas {
      width: 640px; height: 480px;
      background: #16213e;
      border: 2px solid #4cc9f0;
      border-radius: 8px;
    }
    #overlay-canvas {
      position: absolute; top: 0; left: 0;
      pointer-events: none;
    }
    #status {
      margin-top: 15px; padding: 10px 20px;
      background: #16213e; border-radius: 4px;
      font-family: monospace;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #60a5fa; }
    .warning { color: #fbbf24; }
    button {
      padding: 10px 25px;
      background: #4cc9f0; color: #1a1a2e;
      border: none; border-radius: 4px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
    button:disabled { background: #4b5563; cursor: not-allowed; }
    .button-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
    .controls { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; max-width: 640px; width: 100%; }
    .slider-group {
      display: flex; align-items: center; gap: 10px;
      background: #16213e; padding: 10px 15px; border-radius: 4px;
    }
    .slider-group label { min-width: 100px; font-size: 14px; }
    input[type="range"] { flex: 1; max-width: 150px; }
    input[type="checkbox"] { width: 18px; height: 18px; }
    .value-display { min-width: 30px; text-align: right; font-family: monospace; }
    #debug {
      margin-top: 15px; padding: 15px;
      background: #16213e; border-radius: 4px;
      font-family: monospace; font-size: 12px;
      white-space: pre; max-width: 640px; width: 100%;
    }
    .pose-display {
      margin-top: 15px; padding: 15px;
      background: #16213e; border-radius: 4px;
      max-width: 640px; width: 100%;
    }
    .pose-display h3 { color: #4cc9f0; margin-bottom: 10px; font-size: 14px; }
    .pose-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pose-item { text-align: center; }
    .pose-label { font-size: 11px; color: #888; }
    .pose-value { font-family: monospace; font-size: 16px; color: #4ade80; }
  </style>
</head>
<body>
  <h1>QUAR WebAR Engine</h1>
  <p class="subtitle">Optical Flow Tracking Demo (Sprint 4)</p>

  <div class="canvas-container">
    <canvas id="ar-canvas" width="640" height="480"></canvas>
    <canvas id="overlay-canvas" width="640" height="480"></canvas>
  </div>

  <div id="status" class="info">Click "Start Camera" to begin</div>

  <div class="button-group">
    <button id="start-btn">Start Camera</button>
    <button id="switch-btn" disabled>Switch Camera</button>
    <button id="reset-btn" disabled>Reset Tracker</button>
    <button id="stop-btn" disabled>Stop</button>
  </div>

  <div class="controls">
    <div class="slider-group">
      <label>Threshold:</label>
      <input type="range" id="threshold" min="10" max="80" value="30">
      <span id="threshold-value" class="value-display">30</span>
    </div>
    <div class="slider-group">
      <input type="checkbox" id="show-features" checked>
      <label>Show Features</label>
      <input type="checkbox" id="show-flow" checked style="margin-left: 20px;">
      <label>Show Flow</label>
    </div>
  </div>

  <div class="pose-display">
    <h3>Camera Pose (Rotation)</h3>
    <div class="pose-grid">
      <div class="pose-item">
        <div class="pose-label">Roll (X)</div>
        <div class="pose-value" id="pose-roll">0.0°</div>
      </div>
      <div class="pose-item">
        <div class="pose-label">Pitch (Y)</div>
        <div class="pose-value" id="pose-pitch">0.0°</div>
      </div>
      <div class="pose-item">
        <div class="pose-label">Yaw (Z)</div>
        <div class="pose-value" id="pose-yaw">0.0°</div>
      </div>
    </div>
  </div>

  <div id="debug">
QUAR Engine Debug Info
----------------------
State: waiting
Camera: --
FPS: --
Features: --
Tracking: --
  </div>

  <script type="module">
    const canvas = document.getElementById('ar-canvas');
    const overlayCanvas = document.getElementById('overlay-canvas');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const switchBtn = document.getElementById('switch-btn');
    const resetBtn = document.getElementById('reset-btn');
    const stopBtn = document.getElementById('stop-btn');
    const debug = document.getElementById('debug');
    const thresholdSlider = document.getElementById('threshold');
    const thresholdValue = document.getElementById('threshold-value');
    const showFeaturesCheckbox = document.getElementById('show-features');
    const showFlowCheckbox = document.getElementById('show-flow');
    const poseRoll = document.getElementById('pose-roll');
    const posePitch = document.getElementById('pose-pitch');
    const poseYaw = document.getElementById('pose-yaw');

    const ctx = canvas.getContext('2d');
    const overlayCtx = overlayCanvas.getContext('2d');

    let wasmModule = null;
    let trackerHandle = null;
    let detectFeatures = null;
    let prevKeypoints = [];

    async function loadWasm() {
      try {
        const pkg = await import('../pkg/quar_engine.js');
        await pkg.default();
        wasmModule = pkg;
        detectFeatures = pkg.detect_features;
        trackerHandle = new pkg.TrackerHandle();
        console.log('WASM loaded:', pkg.version());
        return true;
      } catch (err) {
        console.warn('WASM not available:', err);
        return false;
      }
    }

    thresholdSlider.addEventListener('input', () => {
      thresholdValue.textContent = thresholdSlider.value;
    });

    // Convert quaternion to Euler angles (degrees)
    function quaternionToEuler(qx, qy, qz, qw) {
      const sinr_cosp = 2 * (qw * qx + qy * qz);
      const cosr_cosp = 1 - 2 * (qx * qx + qy * qy);
      const roll = Math.atan2(sinr_cosp, cosr_cosp);

      const sinp = 2 * (qw * qy - qz * qx);
      const pitch = Math.abs(sinp) >= 1 ? Math.sign(sinp) * Math.PI / 2 : Math.asin(sinp);

      const siny_cosp = 2 * (qw * qz + qx * qy);
      const cosy_cosp = 1 - 2 * (qy * qy + qz * qz);
      const yaw = Math.atan2(siny_cosp, cosy_cosp);

      return {
        roll: roll * 180 / Math.PI,
        pitch: pitch * 180 / Math.PI,
        yaw: yaw * 180 / Math.PI
      };
    }

    class CameraManager {
      constructor() {
        this.video = null;
        this.stream = null;
        this.animationId = null;
        this.facingMode = 'environment';
        this.fps = 0;
        this.frameCount = 0;
        this.lastFpsTime = 0;
        this.featureCount = 0;
        this.trackedPoints = 0;
        this.currentPose = null;
      }

      async start() {
        this.video = document.createElement('video');
        this.video.setAttribute('playsinline', '');
        this.video.muted = true;
        this.video.autoplay = true;

        const constraints = {
          video: { facingMode: { ideal: this.facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        };

        this.stream = await navigator.mediaDevices.getUserMedia(constraints);
        this.video.srcObject = this.stream;
        await new Promise(resolve => { this.video.onloadedmetadata = resolve; });
        await this.video.play();
        this.startRenderLoop();
        return { width: this.video.videoWidth, height: this.video.videoHeight };
      }

      startRenderLoop() {
        const render = () => {
          if (!this.video) return;

          this.frameCount++;
          const now = performance.now();
          if (now - this.lastFpsTime >= 1000) {
            this.fps = this.frameCount;
            this.frameCount = 0;
            this.lastFpsTime = now;
          }

          // Draw video
          const videoAspect = this.video.videoWidth / this.video.videoHeight;
          const canvasAspect = canvas.width / canvas.height;
          let drawWidth, drawHeight, offsetX, offsetY;

          if (videoAspect > canvasAspect) {
            drawHeight = canvas.height;
            drawWidth = canvas.height * videoAspect;
            offsetX = (canvas.width - drawWidth) / 2;
            offsetY = 0;
          } else {
            drawWidth = canvas.width;
            drawHeight = canvas.width / videoAspect;
            offsetX = 0;
            offsetY = (canvas.height - drawHeight) / 2;
          }

          ctx.drawImage(this.video, offsetX, offsetY, drawWidth, drawHeight);
          overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

          // Process with tracker
          if (trackerHandle) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pose = trackerHandle.process_frame(imageData.data, canvas.width, canvas.height);

            this.trackedPoints = trackerHandle.tracked_points();

            if (pose) {
              this.currentPose = pose;
              const euler = quaternionToEuler(pose.rotation[0], pose.rotation[1], pose.rotation[2], pose.rotation[3]);
              poseRoll.textContent = euler.roll.toFixed(1) + '°';
              posePitch.textContent = euler.pitch.toFixed(1) + '°';
              poseYaw.textContent = euler.yaw.toFixed(1) + '°';
            }
          }

          // Detect and draw features
          if (showFeaturesCheckbox.checked && detectFeatures) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const threshold = parseInt(thresholdSlider.value);
            const keypoints = detectFeatures(imageData.data, canvas.width, canvas.height, threshold);

            this.featureCount = keypoints ? keypoints.length : 0;

            if (keypoints && keypoints.length > 0) {
              overlayCtx.fillStyle = '#4ade80';
              overlayCtx.strokeStyle = '#22c55e';

              for (const kp of keypoints) {
                overlayCtx.beginPath();
                overlayCtx.arc(kp.x, kp.y, 3, 0, Math.PI * 2);
                overlayCtx.fill();
              }

              // Draw flow vectors
              if (showFlowCheckbox.checked && prevKeypoints.length > 0) {
                overlayCtx.strokeStyle = '#f59e0b';
                overlayCtx.lineWidth = 1;

                for (const curr of keypoints) {
                  // Find nearest previous keypoint
                  let minDist = 50;
                  let nearest = null;
                  for (const prev of prevKeypoints) {
                    const dx = curr.x - prev.x;
                    const dy = curr.y - prev.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < minDist && dist > 2) {
                      minDist = dist;
                      nearest = prev;
                    }
                  }

                  if (nearest) {
                    overlayCtx.beginPath();
                    overlayCtx.moveTo(nearest.x, nearest.y);
                    overlayCtx.lineTo(curr.x, curr.y);
                    overlayCtx.stroke();
                  }
                }
              }

              prevKeypoints = keypoints.slice(0, 200);
            }
          }

          this.animationId = requestAnimationFrame(render);
        };

        this.animationId = requestAnimationFrame(render);
      }

      async switchCamera() {
        this.facingMode = this.facingMode === 'environment' ? 'user' : 'environment';
        this.stop();
        return await this.start();
      }

      reset() {
        if (trackerHandle) {
          trackerHandle.reset();
        }
        prevKeypoints = [];
        this.currentPose = null;
      }

      stop() {
        if (this.animationId) { cancelAnimationFrame(this.animationId); this.animationId = null; }
        if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
        if (this.video) { this.video.srcObject = null; this.video = null; }
        ctx.fillStyle = '#16213e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      }

      getDebugInfo() {
        return {
          fps: this.fps,
          facingMode: this.facingMode,
          resolution: this.video ? `${this.video.videoWidth}x${this.video.videoHeight}` : '--',
          featureCount: this.featureCount,
          trackedPoints: this.trackedPoints
        };
      }
    }

    let camera = new CameraManager();
    let debugInterval = null;
    let wasmLoaded = false;

    function setStatus(msg, type = 'info') { status.textContent = msg; status.className = type; }

    function updateDebug() {
      const info = camera.getDebugInfo();
      debug.textContent = `QUAR Engine Debug Info
----------------------
State: ${camera.video ? 'tracking' : 'stopped'}
Camera: ${info.facingMode}
FPS: ${info.fps}
Resolution: ${info.resolution}
Features: ${info.featureCount}
Tracked: ${info.trackedPoints}
WASM: ${wasmLoaded ? 'loaded' : 'not available'}`;
    }

    startBtn.addEventListener('click', async () => {
      if (!window.isSecureContext) { setStatus('Camera requires HTTPS.', 'error'); return; }
      if (!navigator.mediaDevices?.getUserMedia) { setStatus('Camera API not available.', 'error'); return; }

      try {
        setStatus('Starting camera...', 'info');
        startBtn.disabled = true;
        const res = await camera.start();
        setStatus(`Tracking: ${res.width}x${res.height}`, 'success');
        switchBtn.disabled = false;
        resetBtn.disabled = false;
        stopBtn.disabled = false;
        debugInterval = setInterval(updateDebug, 500);
      } catch (err) {
        setStatus(`Camera error: ${err.message}`, 'error');
        startBtn.disabled = false;
      }
    });

    switchBtn.addEventListener('click', async () => {
      try {
        setStatus('Switching...', 'info');
        switchBtn.disabled = true;
        const res = await camera.switchCamera();
        setStatus(`Switched: ${res.width}x${res.height}`, 'success');
        switchBtn.disabled = false;
      } catch (err) {
        setStatus(`Switch failed: ${err.message}`, 'error');
        switchBtn.disabled = false;
      }
    });

    resetBtn.addEventListener('click', () => {
      camera.reset();
      setStatus('Tracker reset', 'info');
    });

    stopBtn.addEventListener('click', () => {
      camera.stop();
      clearInterval(debugInterval);
      setStatus('Stopped', 'warning');
      startBtn.disabled = false;
      switchBtn.disabled = true;
      resetBtn.disabled = true;
      stopBtn.disabled = true;
      updateDebug();
    });

    (async () => {
      wasmLoaded = await loadWasm();
      updateDebug();
      if (window.isSecureContext) {
        setStatus(wasmLoaded ? 'Ready. Click "Start Camera".' : 'WASM failed to load.', wasmLoaded ? 'success' : 'warning');
      } else {
        setStatus('Not secure context - use HTTPS', 'warning');
      }
    })();
  </script>
</body>
</html>
