name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust checks and tests
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  # WASM build
  wasm:
    name: WASM Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM (release)
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Check binary size
        run: |
          echo "WASM binary size:"
          ls -lh pkg/quar_engine_bg.wasm
          echo ""
          echo "Gzipped size:"
          gzip -c pkg/quar_engine_bg.wasm | wc -c | awk '{printf "%.2f KB\n", $1/1024}'

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

  # TypeScript SDK checks
  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Type check
        working-directory: sdk
        run: npm run typecheck

      - name: Lint
        working-directory: sdk
        run: npm run lint

      - name: Run tests
        working-directory: sdk
        run: npm test

      - name: Build SDK
        working-directory: sdk
        run: npm run build

  # Integration test (WASM + SDK)
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [wasm, sdk]

    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      # TODO: Add browser-based integration tests
      - name: Integration test placeholder
        run: echo "Integration tests will be added in future sprints"

  # Release job (only on main)
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [rust, wasm, sdk, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

      - name: Create release artifact
        run: |
          mkdir -p release
          cp -r pkg release/wasm
          cp -r sdk/dist release/sdk 2>/dev/null || echo "SDK not built"
          cp README.md release/
          tar -czvf quar-engine-${{ github.sha }}.tar.gz release/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: quar-engine-release
          path: quar-engine-*.tar.gz
          retention-days: 30
