<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>QUAR Engine - QR Code AR Tracking Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #eee;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #video-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    #three-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* HUD Panel */
    #hud {
      position: absolute;
      top: 20px; left: 20px;
      background: rgba(0,0,0,0.85);
      padding: 15px 20px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      z-index: 100;
      min-width: 180px;
    }

    #hud h2 {
      color: #22c55e;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .stat { margin: 5px 0; }
    .stat-label { color: #888; }
    .stat-value { color: #4ade80; }

    /* Settings Panel */
    #settings-panel {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(0,0,0,0.85);
      padding: 15px 20px;
      border-radius: 8px;
      z-index: 100;
      min-width: 200px;
    }

    #settings-panel h3 {
      color: #60a5fa;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .slider-row label {
      font-size: 12px;
      color: #888;
      min-width: 80px;
    }

    .slider-row input[type="range"] {
      flex: 1;
    }

    .slider-row .value {
      font-size: 13px;
      color: #4ade80;
      min-width: 50px;
      text-align: right;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-secondary {
      background: #374151;
      color: white;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .btn.active {
      background: #22c55e;
    }

    /* Start button */
    #start-btn {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      z-index: 200;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    #start-btn:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }

    .hidden { display: none !important; }

    /* Tracking indicator */
    #tracking-indicator {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: rgba(0,0,0,0.8);
      border-radius: 30px;
      font-size: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #tracking-indicator .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }

    #tracking-indicator.tracking .dot {
      background: #22c55e;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Model selector */
    .model-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .model-option {
      padding: 6px 12px;
      background: #374151;
      border: 2px solid transparent;
      border-radius: 6px;
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .model-option:hover {
      background: #4b5563;
    }

    .model-option.active {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.2);
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="video-canvas"></canvas>
    <canvas id="three-canvas"></canvas>

    <button id="start-btn">Start QR AR Tracking</button>

    <div id="hud" class="hidden">
      <h2>QR AR Tracking</h2>
      <div class="stat">
        <span class="stat-label">FPS: </span>
        <span class="stat-value" id="fps">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">QR Detected: </span>
        <span class="stat-value" id="qr-detected">No</span>
      </div>
      <div class="stat">
        <span class="stat-label">Distance: </span>
        <span class="stat-value" id="distance">-</span>
      </div>
      <div class="stat">
        <span class="stat-label">Confidence: </span>
        <span class="stat-value" id="confidence">-</span>
      </div>
      <div class="stat">
        <span class="stat-label">Patterns: </span>
        <span class="stat-value" id="patterns">0</span>
      </div>
    </div>

    <div id="settings-panel" class="hidden">
      <h3>AR Settings</h3>

      <div class="slider-row">
        <label>Object Scale:</label>
        <input type="range" id="scale-slider" min="0.1" max="2" step="0.1" value="0.5">
        <span class="value" id="scale-value">0.5</span>
      </div>

      <div class="slider-row">
        <label>Smoothing:</label>
        <input type="range" id="smooth-slider" min="0" max="0.95" step="0.05" value="0.7">
        <span class="value" id="smooth-value">0.70</span>
      </div>

      <label style="font-size: 12px; color: #888; display: block; margin-top: 15px;">3D Model:</label>
      <div class="model-options">
        <div class="model-option active" data-model="cube">Cube</div>
        <div class="model-option" data-model="sphere">Sphere</div>
        <div class="model-option" data-model="torus">Torus</div>
        <div class="model-option" data-model="cone">Cone</div>
        <div class="model-option" data-model="axes">Axes</div>
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" id="toggle-wireframe">Wireframe</button>
        <button class="btn btn-secondary" id="toggle-animation">Animate</button>
      </div>
    </div>

    <div id="tracking-indicator" class="hidden">
      <span class="dot"></span>
      <span id="tracking-text">Scanning for QR...</span>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import init, { QrDetectorHandle, version } from './pkg/quar_engine.js';

    let detector = null;
    let videoStream = null;
    let video = null;
    let animationId = null;
    let lastTime = 0;
    let frameCount = 0;
    let fps = 0;

    // Three.js objects
    let scene, camera, renderer;
    let arObject = null;
    let currentModel = 'cube';
    let wireframeMode = false;
    let animationEnabled = true;

    // Smoothing
    let smoothedPosition = null;
    let smoothedQuaternion = null;
    let smoothingFactor = 0.7;

    // Camera intrinsics for projection
    let focalLength = 0;
    let principalX = 0;
    let principalY = 0;

    // Canvas refs
    const videoCanvas = document.getElementById('video-canvas');
    const threeCanvas = document.getElementById('three-canvas');
    const videoCtx = videoCanvas.getContext('2d');

    // UI refs
    const startBtn = document.getElementById('start-btn');
    const hud = document.getElementById('hud');
    const settingsPanel = document.getElementById('settings-panel');
    const trackingIndicator = document.getElementById('tracking-indicator');
    const scaleSlider = document.getElementById('scale-slider');
    const scaleValue = document.getElementById('scale-value');
    const smoothSlider = document.getElementById('smooth-slider');
    const smoothValue = document.getElementById('smooth-value');

    // HUD elements
    const fpsEl = document.getElementById('fps');
    const qrDetectedEl = document.getElementById('qr-detected');
    const distanceEl = document.getElementById('distance');
    const confidenceEl = document.getElementById('confidence');
    const trackingText = document.getElementById('tracking-text');

    // Event listeners
    startBtn.addEventListener('click', async () => {
      startBtn.classList.add('hidden');
      await startDemo();
    });

    scaleSlider.addEventListener('input', () => {
      const scale = parseFloat(scaleSlider.value);
      scaleValue.textContent = scale.toFixed(1);
      if (arObject) {
        arObject.scale.setScalar(scale);
      }
    });

    smoothSlider.addEventListener('input', () => {
      smoothingFactor = parseFloat(smoothSlider.value);
      smoothValue.textContent = smoothingFactor.toFixed(2);
    });

    document.querySelectorAll('.model-option').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.model-option').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentModel = btn.dataset.model;
        createARObject();
      });
    });

    document.getElementById('toggle-wireframe').addEventListener('click', (e) => {
      wireframeMode = !wireframeMode;
      e.target.classList.toggle('active', wireframeMode);
      createARObject();
    });

    document.getElementById('toggle-animation').addEventListener('click', (e) => {
      animationEnabled = !animationEnabled;
      e.target.classList.toggle('active', animationEnabled);
    });

    function initThreeJS(width, height) {
      scene = new THREE.Scene();

      // Use PerspectiveCamera for proper 3D AR tracking
      // FOV derived from focal length: fov = 2 * atan(height / (2 * fy))
      const fovY = 2 * Math.atan(height / (2 * focalLength)) * (180 / Math.PI);
      camera = new THREE.PerspectiveCamera(fovY, width / height, 0.01, 100);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({
        canvas: threeCanvas,
        alpha: true,
        antialias: true
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);

      // Add lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(1, 1, 1);
      scene.add(directionalLight);

      createARObject();
    }

    function createARObject() {
      if (arObject) {
        scene.remove(arObject);
        arObject.traverse((child) => {
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.dispose());
            } else {
              child.material.dispose();
            }
          }
        });
      }

      const scale = parseFloat(scaleSlider.value);
      // Base size in meters (3cm cube for a 5cm QR code)
      const size = 0.03;

      let geometry, material;

      switch (currentModel) {
        case 'cube':
          geometry = new THREE.BoxGeometry(size, size, size);
          material = new THREE.MeshPhongMaterial({
            color: 0x22c55e,
            wireframe: wireframeMode,
            flatShading: true
          });
          arObject = new THREE.Mesh(geometry, material);
          break;

        case 'sphere':
          geometry = new THREE.SphereGeometry(size / 2, 32, 32);
          material = new THREE.MeshPhongMaterial({
            color: 0x3b82f6,
            wireframe: wireframeMode
          });
          arObject = new THREE.Mesh(geometry, material);
          break;

        case 'torus':
          geometry = new THREE.TorusGeometry(size / 2, size / 6, 16, 48);
          material = new THREE.MeshPhongMaterial({
            color: 0xf59e0b,
            wireframe: wireframeMode
          });
          arObject = new THREE.Mesh(geometry, material);
          break;

        case 'cone':
          geometry = new THREE.ConeGeometry(size / 2, size, 32);
          material = new THREE.MeshPhongMaterial({
            color: 0xef4444,
            wireframe: wireframeMode
          });
          arObject = new THREE.Mesh(geometry, material);
          break;

        case 'axes':
          arObject = new THREE.Group();
          const axisRadius = size * 0.05;
          const axisLength = size;

          // X axis (red)
          const xGeom = new THREE.CylinderGeometry(axisRadius, axisRadius, axisLength, 8);
          const xMat = new THREE.MeshPhongMaterial({ color: 0xef4444 });
          const xAxis = new THREE.Mesh(xGeom, xMat);
          xAxis.rotation.z = -Math.PI / 2;
          xAxis.position.x = axisLength / 2;
          arObject.add(xAxis);

          // Y axis (green)
          const yGeom = new THREE.CylinderGeometry(axisRadius, axisRadius, axisLength, 8);
          const yMat = new THREE.MeshPhongMaterial({ color: 0x22c55e });
          const yAxis = new THREE.Mesh(yGeom, yMat);
          yAxis.position.y = axisLength / 2;
          arObject.add(yAxis);

          // Z axis (blue)
          const zGeom = new THREE.CylinderGeometry(axisRadius, axisRadius, axisLength, 8);
          const zMat = new THREE.MeshPhongMaterial({ color: 0x3b82f6 });
          const zAxis = new THREE.Mesh(zGeom, zMat);
          zAxis.rotation.x = Math.PI / 2;
          zAxis.position.z = axisLength / 2;
          arObject.add(zAxis);

          // Origin sphere
          const originGeom = new THREE.SphereGeometry(axisRadius * 2, 16, 16);
          const originMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
          const origin = new THREE.Mesh(originGeom, originMat);
          arObject.add(origin);
          break;
      }

      arObject.scale.setScalar(scale);
      arObject.visible = false;
      scene.add(arObject);
    }

    async function startDemo() {
      try {
        // Initialize WASM
        await init();
        console.log('QUAR Engine:', version());

        // Create QR detector
        detector = new QrDetectorHandle();
        detector.set_qr_size(0.05); // 5cm default

        // Start camera
        const constraints = {
          video: {
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        video = document.createElement('video');
        video.srcObject = videoStream;
        video.playsInline = true;
        await video.play();

        // Set canvas sizes
        const width = video.videoWidth;
        const height = video.videoHeight;
        videoCanvas.width = width;
        videoCanvas.height = height;
        threeCanvas.width = width;
        threeCanvas.height = height;

        // Set camera intrinsics (approximate)
        const fx = width * 0.8;
        const fy = width * 0.8;
        const cx = width / 2;
        const cy = height / 2;
        detector.set_intrinsics(fx, fy, cx, cy);

        // Store intrinsics for Three.js camera
        focalLength = fy;
        principalX = cx;
        principalY = cy;

        // Initialize Three.js
        initThreeJS(width, height);

        // Show UI
        hud.classList.remove('hidden');
        settingsPanel.classList.remove('hidden');
        trackingIndicator.classList.remove('hidden');

        // Start render loop
        requestAnimationFrame(processFrame);

      } catch (err) {
        console.error('Failed to start demo:', err);
        alert('Failed to start: ' + err.message);
      }
    }

    function processFrame(timestamp) {
      animationId = requestAnimationFrame(processFrame);

      // Calculate FPS
      frameCount++;
      if (timestamp - lastTime >= 1000) {
        fps = frameCount;
        frameCount = 0;
        lastTime = timestamp;
        fpsEl.textContent = fps;
      }

      // Draw video frame
      videoCtx.drawImage(video, 0, 0);

      // Get frame data
      const imageData = videoCtx.getImageData(0, 0, videoCanvas.width, videoCanvas.height);

      // Debug: Get number of finder patterns detected
      const patternCount = detector.debug_detect_patterns(imageData.data, videoCanvas.width, videoCanvas.height);
      document.getElementById('patterns').textContent = patternCount;

      // Detect QR codes
      const detections = detector.detect(imageData.data, videoCanvas.width, videoCanvas.height);

      if (detections && detections.length > 0) {
        const qr = detections[0];

        // Update HUD
        qrDetectedEl.textContent = 'Yes';
        qrDetectedEl.style.color = '#4ade80';
        confidenceEl.textContent = (qr.confidence * 100).toFixed(0) + '%';

        if (qr.has_pose) {
          distanceEl.textContent = qr.pose_tz.toFixed(2) + 'm';
        } else {
          distanceEl.textContent = '-';
        }

        // Update tracking indicator
        trackingIndicator.classList.add('tracking');
        trackingText.textContent = 'QR Tracking Active';

        // Update AR object position
        updateARObject(qr, timestamp);
        arObject.visible = true;

      } else {
        qrDetectedEl.textContent = 'No';
        qrDetectedEl.style.color = '#888';
        confidenceEl.textContent = '-';
        distanceEl.textContent = '-';

        // Update tracking indicator
        trackingIndicator.classList.remove('tracking');
        trackingText.textContent = 'Scanning for QR...';

        // Hide AR object
        arObject.visible = false;
      }

      // Render Three.js scene
      renderer.render(scene, camera);
    }

    function updateARObject(qr, timestamp) {
      // Use 3D pose from homography decomposition if available
      if (qr.has_pose) {
        // Get 3D translation from pose (in meters)
        // Apply CV-to-Three.js coordinate conversion:
        // CV: X right, Y down, Z forward
        // Three.js: X right, Y up, Z backward (toward viewer)
        const targetX = qr.pose_tx;
        const targetY = -qr.pose_ty;  // Flip Y
        const targetZ = -qr.pose_tz;  // Flip Z (negative = in front of camera)

        // Apply smoothing to 3D position
        if (smoothedPosition === null) {
          smoothedPosition = { x: targetX, y: targetY, z: targetZ };
        } else {
          const alpha = 1 - smoothingFactor;
          smoothedPosition.x = smoothedPosition.x * smoothingFactor + targetX * alpha;
          smoothedPosition.y = smoothedPosition.y * smoothingFactor + targetY * alpha;
          smoothedPosition.z = smoothedPosition.z * smoothingFactor + targetZ * alpha;
        }

        // Position the AR object using 3D pose
        arObject.position.set(smoothedPosition.x, smoothedPosition.y, smoothedPosition.z);

        // Scale object relative to detected QR size in pixels
        // Larger QR = closer = larger apparent object
        const baseScale = parseFloat(scaleSlider.value);
        const sizeScale = qr.size_pixels / 100; // Normalize: 100px QR = 1x scale
        arObject.scale.setScalar(baseScale * sizeScale);

        // Apply rotation with smoothing
        if (animationEnabled) {
          // Add spinning animation on top of base pose
          arObject.rotation.y = timestamp * 0.002;
          arObject.rotation.x = Math.sin(timestamp * 0.001) * 0.3;
        } else {
          // Apply CV-to-Three.js coordinate conversion for quaternion:
          // Negate Y and Z components to convert from CV to Three.js frame
          const quat = new THREE.Quaternion(
            qr.pose_qx,      // X stays same
            -qr.pose_qy,     // Y negated
            -qr.pose_qz,     // Z negated
            qr.pose_qw       // W stays same
          );

          // Apply pose rotation with smoothing
          if (smoothedQuaternion === null) {
            smoothedQuaternion = quat.clone();
          } else {
            smoothedQuaternion.slerp(quat, 1 - smoothingFactor);
          }
          arObject.quaternion.copy(smoothedQuaternion);
        }
      } else {
        // Fallback: use 2D pixel position if no 3D pose available
        const targetX = qr.center_x;
        const targetY = qr.center_y;
        const qrSizePixels = qr.size_pixels;

        // Estimate depth from QR size (larger = closer)
        // Assume default QR size of 5cm (0.05m)
        const qrSizeMeters = 0.05;
        const estimatedZ = -(focalLength * qrSizeMeters) / qrSizePixels;

        // Convert 2D pixel position to 3D using pinhole camera model
        const x3d = (targetX - principalX) * (-estimatedZ) / focalLength;
        const y3d = -(targetY - principalY) * (-estimatedZ) / focalLength;

        if (smoothedPosition === null) {
          smoothedPosition = { x: x3d, y: y3d, z: estimatedZ };
        } else {
          const alpha = 1 - smoothingFactor;
          smoothedPosition.x = smoothedPosition.x * smoothingFactor + x3d * alpha;
          smoothedPosition.y = smoothedPosition.y * smoothingFactor + y3d * alpha;
          smoothedPosition.z = smoothedPosition.z * smoothingFactor + estimatedZ * alpha;
        }

        arObject.position.set(smoothedPosition.x, smoothedPosition.y, smoothedPosition.z);

        // Scale object relative to detected QR size in pixels
        // Larger QR = closer = larger scale
        const baseScale = parseFloat(scaleSlider.value);
        const sizeScale = qrSizePixels / 100; // Normalize: 100px QR = 1x scale
        arObject.scale.setScalar(baseScale * sizeScale);

        // Calculate 2D rotation from QR corners
        const dx = qr.corner_tr_x - qr.corner_tl_x;
        const dy = qr.corner_tr_y - qr.corner_tl_y;
        const angle = Math.atan2(dy, dx);

        if (animationEnabled) {
          arObject.rotation.y = timestamp * 0.002;
          arObject.rotation.x = Math.sin(timestamp * 0.001) * 0.3;
        } else {
          arObject.rotation.set(0, 0, -angle);
        }
      }
    }
  </script>
</body>
</html>
