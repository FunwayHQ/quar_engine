<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUAR Engine - AR Cube Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #three-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #hud {
      position: absolute;
      top: 20px; left: 20px;
      background: rgba(0,0,0,0.7);
      padding: 15px 20px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      z-index: 100;
    }
    #hud h2 {
      color: #4cc9f0;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .stat { margin: 5px 0; }
    .stat-label { color: #888; }
    .stat-value { color: #4ade80; }
    #controls {
      position: absolute;
      bottom: 100px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    button {
      padding: 12px 25px;
      background: #4cc9f0;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
    button:disabled { background: #4b5563; cursor: not-allowed; }
    #status {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      padding: 20px 30px;
      border-radius: 8px;
      text-align: center;
      z-index: 100;
    }
    #status.hidden { display: none; }
    .pose-display {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .pose-item { text-align: center; }
    .pose-label { font-size: 11px; color: #888; }
    .pose-value { font-size: 14px; color: #f59e0b; }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="video-canvas"></canvas>
    <canvas id="three-canvas"></canvas>

    <div id="hud">
      <h2>QUAR AR Demo</h2>
      <div class="stat">
        <span class="stat-label">FPS: </span>
        <span class="stat-value" id="fps">--</span>
      </div>
      <div class="stat">
        <span class="stat-label">Tracked: </span>
        <span class="stat-value" id="tracked">--</span>
      </div>
      <div class="stat">
        <span class="stat-label">State: </span>
        <span class="stat-value" id="state">initializing</span>
      </div>
      <div class="pose-display">
        <div class="pose-item">
          <div class="pose-label">Roll</div>
          <div class="pose-value" id="roll">0.0</div>
        </div>
        <div class="pose-item">
          <div class="pose-label">Pitch</div>
          <div class="pose-value" id="pitch">0.0</div>
        </div>
        <div class="pose-item">
          <div class="pose-label">Yaw</div>
          <div class="pose-value" id="yaw">0.0</div>
        </div>
      </div>
    </div>

    <div id="status">
      <p>Click Start to begin AR tracking</p>
    </div>

    <div id="controls">
      <button id="start-btn">Start AR</button>
      <button id="reset-btn" disabled>Reset</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // DOM elements
    const videoCanvas = document.getElementById('video-canvas');
    const threeCanvas = document.getElementById('three-canvas');
    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const fpsEl = document.getElementById('fps');
    const trackedEl = document.getElementById('tracked');
    const stateEl = document.getElementById('state');
    const rollEl = document.getElementById('roll');
    const pitchEl = document.getElementById('pitch');
    const yawEl = document.getElementById('yaw');

    const videoCtx = videoCanvas.getContext('2d');

    // Three.js setup
    let scene, camera, renderer, cube;
    let arGroup; // Group that will be transformed by tracking

    // Tracking state
    let wasmModule = null;
    let trackerHandle = null;
    let video = null;
    let stream = null;
    let animationId = null;
    let isRunning = false;

    // FPS tracking
    let frameCount = 0;
    let lastFpsTime = 0;
    let currentFps = 0;

    // Smoothing
    const smoothingFactor = 0.15;
    let smoothedRotation = { roll: 0, pitch: 0, yaw: 0 };

    async function loadWasm() {
      try {
        const pkg = await import('./pkg/quar_engine.js');
        await pkg.default();
        wasmModule = pkg;
        trackerHandle = new pkg.TrackerHandle();
        console.log('WASM loaded:', pkg.version());
        return true;
      } catch (err) {
        console.error('WASM load failed:', err);
        return false;
      }
    }

    function initThreeJS() {
      // Scene
      scene = new THREE.Scene();

      // Camera - perspective matching typical phone FOV
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 3);

      // Renderer with alpha for transparent background
      renderer = new THREE.WebGLRenderer({
        canvas: threeCanvas,
        alpha: true,
        antialias: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);

      // AR group - this is what we'll rotate based on tracking
      arGroup = new THREE.Group();
      scene.add(arGroup);

      // Red cube
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshStandardMaterial({
        color: 0xff3333,
        roughness: 0.4,
        metalness: 0.3
      });
      cube = new THREE.Mesh(geometry, material);
      arGroup.add(cube);

      // Add edges for better visibility
      const edges = new THREE.EdgesGeometry(geometry);
      const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
      const wireframe = new THREE.LineSegments(edges, lineMaterial);
      cube.add(wireframe);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(5, 5, 5);
      scene.add(directionalLight);

      const backLight = new THREE.DirectionalLight(0x4cc9f0, 0.3);
      backLight.position.set(-5, -5, -5);
      scene.add(backLight);

      // Handle resize
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      videoCanvas.width = window.innerWidth;
      videoCanvas.height = window.innerHeight;
    }

    async function startCamera() {
      video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.muted = true;
      video.autoplay = true;

      const constraints = {
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;

      await new Promise(resolve => { video.onloadedmetadata = resolve; });
      await video.play();

      // Set canvas sizes
      videoCanvas.width = window.innerWidth;
      videoCanvas.height = window.innerHeight;

      return { width: video.videoWidth, height: video.videoHeight };
    }

    function quaternionToEuler(qx, qy, qz, qw) {
      // Roll (x-axis rotation)
      const sinr_cosp = 2 * (qw * qx + qy * qz);
      const cosr_cosp = 1 - 2 * (qx * qx + qy * qy);
      const roll = Math.atan2(sinr_cosp, cosr_cosp);

      // Pitch (y-axis rotation)
      const sinp = 2 * (qw * qy - qz * qx);
      const pitch = Math.abs(sinp) >= 1
        ? Math.sign(sinp) * Math.PI / 2
        : Math.asin(sinp);

      // Yaw (z-axis rotation)
      const siny_cosp = 2 * (qw * qz + qx * qy);
      const cosy_cosp = 1 - 2 * (qy * qy + qz * qz);
      const yaw = Math.atan2(siny_cosp, cosy_cosp);

      return { roll, pitch, yaw };
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function render() {
      if (!isRunning) return;

      // FPS calculation
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        currentFps = frameCount;
        frameCount = 0;
        lastFpsTime = now;
        fpsEl.textContent = currentFps;
      }

      // Draw video to canvas
      if (video && video.readyState >= 2) {
        const videoAspect = video.videoWidth / video.videoHeight;
        const canvasAspect = videoCanvas.width / videoCanvas.height;

        let drawWidth, drawHeight, offsetX, offsetY;

        if (videoAspect > canvasAspect) {
          drawHeight = videoCanvas.height;
          drawWidth = videoCanvas.height * videoAspect;
          offsetX = (videoCanvas.width - drawWidth) / 2;
          offsetY = 0;
        } else {
          drawWidth = videoCanvas.width;
          drawHeight = videoCanvas.width / videoAspect;
          offsetX = 0;
          offsetY = (videoCanvas.height - drawHeight) / 2;
        }

        videoCtx.drawImage(video, offsetX, offsetY, drawWidth, drawHeight);

        // Process frame with tracker
        if (trackerHandle) {
          // Use a smaller canvas for processing
          const processWidth = 640;
          const processHeight = 480;

          const processCanvas = document.createElement('canvas');
          processCanvas.width = processWidth;
          processCanvas.height = processHeight;
          const processCtx = processCanvas.getContext('2d');
          processCtx.drawImage(video, 0, 0, processWidth, processHeight);

          const imageData = processCtx.getImageData(0, 0, processWidth, processHeight);
          const pose = trackerHandle.process_frame(imageData.data, processWidth, processHeight);

          const trackedPoints = trackerHandle.tracked_points();
          trackedEl.textContent = trackedPoints;

          if (pose && trackedPoints > 10) {
            stateEl.textContent = 'tracking';
            stateEl.style.color = '#4ade80';

            // Convert quaternion to euler angles
            const euler = quaternionToEuler(
              pose.rotation[0],
              pose.rotation[1],
              pose.rotation[2],
              pose.rotation[3]
            );

            // Apply smoothing
            smoothedRotation.roll = lerp(smoothedRotation.roll, euler.roll, smoothingFactor);
            smoothedRotation.pitch = lerp(smoothedRotation.pitch, euler.pitch, smoothingFactor);
            smoothedRotation.yaw = lerp(smoothedRotation.yaw, euler.yaw, smoothingFactor);

            // Update HUD
            rollEl.textContent = (smoothedRotation.roll * 180 / Math.PI).toFixed(1) + '°';
            pitchEl.textContent = (smoothedRotation.pitch * 180 / Math.PI).toFixed(1) + '°';
            yawEl.textContent = (smoothedRotation.yaw * 180 / Math.PI).toFixed(1) + '°';

            // Apply rotation to Three.js camera to match phone orientation
            // Using only pitch (vertical) and yaw (horizontal), disable roll
            const sensitivity = 0.7; // 30% less sensitive
            camera.rotation.x = smoothedRotation.pitch * sensitivity;  // tilt up/down
            camera.rotation.y = smoothedRotation.yaw * sensitivity;    // rotate left/right
            camera.rotation.z = 0; // disable roll - causes interference

          } else {
            stateEl.textContent = trackedPoints > 0 ? 'initializing' : 'lost';
            stateEl.style.color = trackedPoints > 0 ? '#fbbf24' : '#f87171';
          }
        }
      }

      // Render Three.js scene
      renderer.render(scene, camera);

      animationId = requestAnimationFrame(render);
    }

    function reset() {
      if (trackerHandle) {
        trackerHandle.reset();
      }
      smoothedRotation = { roll: 0, pitch: 0, yaw: 0 };
      arGroup.rotation.set(0, 0, 0);
      stateEl.textContent = 'initializing';
      stateEl.style.color = '#fbbf24';
    }

    function stop() {
      isRunning = false;
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      if (video) {
        video.srcObject = null;
        video = null;
      }
    }

    // Event handlers
    startBtn.addEventListener('click', async () => {
      if (!window.isSecureContext) {
        statusDiv.innerHTML = '<p style="color: #f87171">HTTPS required for camera access</p>';
        return;
      }

      try {
        startBtn.disabled = true;
        statusDiv.innerHTML = '<p>Loading WASM...</p>';

        if (!wasmModule) {
          const loaded = await loadWasm();
          if (!loaded) {
            statusDiv.innerHTML = '<p style="color: #f87171">Failed to load WASM module</p>';
            startBtn.disabled = false;
            return;
          }
        }

        statusDiv.innerHTML = '<p>Starting camera...</p>';
        const res = await startCamera();
        console.log('Camera started:', res);

        initThreeJS();
        onWindowResize();

        statusDiv.classList.add('hidden');
        resetBtn.disabled = false;
        isRunning = true;
        lastFpsTime = performance.now();

        render();
      } catch (err) {
        console.error('Start failed:', err);
        statusDiv.innerHTML = `<p style="color: #f87171">Error: ${err.message}</p>`;
        startBtn.disabled = false;
      }
    });

    resetBtn.addEventListener('click', reset);

    // Initial state
    if (!window.isSecureContext) {
      statusDiv.innerHTML = '<p style="color: #fbbf24">HTTPS required - use localhost or deploy</p>';
    }
  </script>
</body>
</html>
