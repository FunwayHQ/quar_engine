<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>QUAR Engine - Advanced AR Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
    }

    /* EXACT same structure as basic demo */
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #three-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* HUD Panel */
    #hud {
      position: absolute;
      top: 20px; left: 20px;
      background: rgba(0,0,0,0.7);
      padding: 15px 20px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      z-index: 100;
    }
    #hud h2 {
      color: #4cc9f0;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .stat { margin: 5px 0; }
    .stat-label { color: #888; }
    .stat-value { color: #4ade80; }

    /* IMU Panel */
    #imu-panel {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(0,0,0,0.7);
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 100;
    }
    #imu-panel h3 {
      color: #4cc9f0;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .imu-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }
    .imu-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
    }
    .imu-dot.active { background: #4ade80; }
    .imu-dot.warning { background: #facc15; }
    .imu-dot.error { background: #f87171; }

    /* Controls */
    #controls {
      position: absolute;
      bottom: 40px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    button {
      padding: 12px 25px;
      background: #4cc9f0;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
    button:disabled { background: #4b5563; cursor: not-allowed; }

    /* Start overlay */
    #start-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    #start-overlay h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }
    #start-overlay p {
      color: #888;
      margin-bottom: 30px;
    }
    #start-overlay.hidden { display: none; }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="video-canvas"></canvas>
    <canvas id="three-canvas"></canvas>

    <div id="hud">
      <h2>Advanced AR</h2>
      <div class="stat">
        <span class="stat-label">FPS: </span>
        <span class="stat-value" id="fps">--</span>
      </div>
      <div class="stat">
        <span class="stat-label">Features: </span>
        <span class="stat-value" id="features">--</span>
      </div>
      <div class="stat">
        <span class="stat-label">State: </span>
        <span class="stat-value" id="state">initializing</span>
      </div>
      <div class="stat">
        <span class="stat-label">Gyro: </span>
        <span class="stat-value" id="gyro-debug" style="font-size:11px">--</span>
      </div>
      <div class="stat">
        <span class="stat-label">Cam: </span>
        <span class="stat-value" id="cam-debug" style="font-size:11px">--</span>
      </div>
    </div>

    <div id="imu-panel">
      <h3>IMU Sensors</h3>
      <div class="imu-row">
        <div class="imu-dot" id="gyro-dot"></div>
        <span>Gyroscope</span>
      </div>
      <div class="imu-row">
        <div class="imu-dot" id="accel-dot"></div>
        <span>Accelerometer</span>
      </div>
      <div class="imu-row">
        <div class="imu-dot" id="calib-dot"></div>
        <span id="calib-text">Calibration</span>
      </div>
    </div>

    <div id="controls">
      <button id="reset-btn" disabled>Reset</button>
    </div>

    <div id="sensitivity-panel" style="position:absolute;bottom:100px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.8);padding:12px 20px;border-radius:8px;z-index:100;">
      <span style="font-size:14px;color:#888;">Sens:</span>
      <input type="range" id="sensitivity" min="0.1" max="2" step="0.1" value="1" style="width:120px;height:20px;-webkit-appearance:auto;">
      <span id="sens-val" style="font-size:14px;color:#4ade80;min-width:35px;">1.0</span>
    </div>

    <div id="start-overlay">
      <h1>QUAR Engine</h1>
      <p>Advanced AR with IMU Fusion v2 (6DoF Translation)</p>
      <button id="start-btn">Start AR</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import init, { Tracker6DoFHandle, version } from './pkg/quar_engine.js';

    // DOM elements
    const videoCanvas = document.getElementById('video-canvas');
    const threeCanvas = document.getElementById('three-canvas');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const fpsEl = document.getElementById('fps');
    const featuresEl = document.getElementById('features');
    const stateEl = document.getElementById('state');
    const gyroDot = document.getElementById('gyro-dot');
    const accelDot = document.getElementById('accel-dot');
    const calibDot = document.getElementById('calib-dot');
    const calibText = document.getElementById('calib-text');
    const gyroDebug = document.getElementById('gyro-debug');
    const camDebug = document.getElementById('cam-debug');
    const sensitivitySlider = document.getElementById('sensitivity');
    const sensVal = document.getElementById('sens-val');

    // Sensitivity control
    let sensitivity = 1.0;
    sensitivitySlider.addEventListener('input', (e) => {
      sensitivity = parseFloat(e.target.value);
      sensVal.textContent = sensitivity.toFixed(1);
    });

    const videoCtx = videoCanvas.getContext('2d');

    // Three.js
    let scene, camera, renderer, cube, arGroup;

    // State
    let wasmModule = null;
    let trackerHandle = null;
    let video = null;
    let stream = null;
    let animationId = null;
    let isRunning = false;

    // FPS
    let frameCount = 0;
    let lastFpsTime = 0;

    // IMU
    let imuDataReceived = false;
    let gyroActive = false;
    let accelActive = false;

    // IMU Fusion state
    let gyroOrientation = { x: 0, y: 0, z: 0 };  // Integrated gyro orientation
    let visualOrientation = { x: 0, y: 0, z: 0 }; // Last visual tracking orientation
    let fusedOrientation = { x: 0, y: 0, z: 0 };  // Fused result
    let lastGyroTime = 0;
    let gyroInitialized = false;

    // Complementary filter alpha (0.98 = 98% gyro, 2% visual correction)
    const GYRO_ALPHA = 0.98;
    const VISUAL_SMOOTHING = 0.15;

    // Translation state (accelerometer-driven)
    let smoothedPosition = new THREE.Vector3(0, 0, 0);
    let jsVelocity = { x: 0, y: 0, z: 0 };
    let jsPosition = { x: 0, y: 0, z: 0 };
    const JS_VEL_DECAY = 0.92;
    const JS_POS_DECAY = 0.97;
    const JS_ACCEL_THRESHOLD = 0.3;
    const JS_VEL_THRESHOLD = 0.01;
    const JS_MAX_OFFSET = 2.0;
    const JS_SMOOTHING = 0.3;

    // Gyroscope integration for AR world-space locking
    //
    // Goal: When phone rotates, cube stays FIXED in real world
    // Implementation: Rotate Three.js camera to match phone's real-world orientation
    //
    // DeviceMotion rotationRate (deg/s) - verified conventions:
    // - beta:  pitch rate around X-axis (left-right axis of phone)
    //          POSITIVE = top of phone tilts TOWARD user (looking DOWN at screen)
    //          NEGATIVE = top of phone tilts AWAY from user (looking UP)
    // - gamma: roll rate around Y-axis (top-bottom axis of phone)
    //          POSITIVE = phone tilts to the RIGHT
    // - alpha: yaw rate around Z-axis (out of screen)
    //          POSITIVE = counter-clockwise rotation from above
    //
    // Three.js camera rotation:
    // - rotation.x: pitch - POSITIVE = look DOWN, NEGATIVE = look UP
    // - rotation.y: yaw - POSITIVE = look LEFT, NEGATIVE = look RIGHT
    // - rotation.z: roll
    //
    // AR mapping for pitch:
    //   Phone tilts UP (beta NEGATIVE) → gyro.x DECREASES → camera.rotation.x should be NEGATIVE
    //   So: camera.rotation.x = fusedOrientation.x (NO inversion needed!)

    function handleGyro(event) {
      if (!event.rotationRate) return;

      const now = performance.now();
      if (!gyroInitialized) {
        lastGyroTime = now;
        gyroInitialized = true;
        return;
      }

      const dt = (now - lastGyroTime) / 1000;
      lastGyroTime = now;

      const degToRad = Math.PI / 180;

      // Get rotation rates and convert to radians
      const betaRate = (event.rotationRate.beta || 0) * degToRad;   // pitch
      const gammaRate = (event.rotationRate.gamma || 0) * degToRad; // roll
      const alphaRate = (event.rotationRate.alpha || 0) * degToRad; // yaw

      // Push IMU data to tracker
      const gyroRate = Math.sqrt(betaRate*betaRate + gammaRate*gammaRate + alphaRate*alphaRate);
      if (trackerHandle) {
        if (trackerHandle.push_gyro) {
          trackerHandle.push_gyro(betaRate, gammaRate, alphaRate, now);
        }
        const accelX = event.accelerationIncludingGravity?.x || 0;
        const accelY = event.accelerationIncludingGravity?.y || 0;
        const accelZ = event.accelerationIncludingGravity?.z || 0;
        trackerHandle.push_imu(accelX, accelY, accelZ, betaRate, gammaRate, alphaRate, now / 1000);
      }

      // JS-side accelerometer integration for translation
      // Uses event.acceleration (gravity-free from device sensor fusion)
      const accel = event.acceleration;
      if (accel && gyroRate < 1.0 && dt > 0 && dt < 0.1) {
        const ax = accel.x || 0;
        const ay = accel.y || 0;
        const az = accel.z || 0;
        const fax = Math.abs(ax) > JS_ACCEL_THRESHOLD ? ax : 0;
        const fay = Math.abs(ay) > JS_ACCEL_THRESHOLD ? ay : 0;
        const faz = Math.abs(az) > JS_ACCEL_THRESHOLD ? az : 0;
        jsVelocity.x += fax * dt;
        jsVelocity.y += fay * dt;
        jsVelocity.z += faz * dt;
      }
      jsVelocity.x *= JS_VEL_DECAY;
      jsVelocity.y *= JS_VEL_DECAY;
      jsVelocity.z *= JS_VEL_DECAY;
      if (Math.abs(jsVelocity.x) < JS_VEL_THRESHOLD) jsVelocity.x = 0;
      if (Math.abs(jsVelocity.y) < JS_VEL_THRESHOLD) jsVelocity.y = 0;
      if (Math.abs(jsVelocity.z) < JS_VEL_THRESHOLD) jsVelocity.z = 0;

      // Integrate gyro - accumulate rotation
      gyroOrientation.x += betaRate * dt;   // pitch: positive=look down, negative=look up
      gyroOrientation.y += gammaRate * dt;  // roll
      gyroOrientation.z += alphaRate * dt;  // yaw

      // Complementary filter: blend gyro (fast, drifts) with visual (slow, stable)
      fusedOrientation.x = GYRO_ALPHA * gyroOrientation.x + (1 - GYRO_ALPHA) * visualOrientation.x;
      fusedOrientation.y = GYRO_ALPHA * gyroOrientation.y + (1 - GYRO_ALPHA) * visualOrientation.y;
      fusedOrientation.z = GYRO_ALPHA * gyroOrientation.z + (1 - GYRO_ALPHA) * visualOrientation.z;

      // Apply to camera with correct axis mapping (based on device testing):
      // - Alpha (z) = pitch (tilt up/down) → camera.rotation.x
      // - Beta (x) = yaw (rotate left/right) → camera.rotation.y
      // - Gamma (y) = roll → camera.rotation.z
      if (isRunning && camera) {
        camera.rotation.x = fusedOrientation.z * sensitivity;   // pitch from alpha
        camera.rotation.y = fusedOrientation.x * sensitivity;   // yaw from beta
        camera.rotation.z = fusedOrientation.y * sensitivity;   // roll from gamma

        // Debug: show integrated gyro values (in degrees for readability)
        const toDeg = 180 / Math.PI;
        gyroDebug.textContent = `β:${(gyroOrientation.x * toDeg).toFixed(0)} γ:${(gyroOrientation.y * toDeg).toFixed(0)} α:${(gyroOrientation.z * toDeg).toFixed(0)}`;
        camDebug.textContent = `x:${(camera.rotation.x * toDeg).toFixed(0)} y:${(camera.rotation.y * toDeg).toFixed(0)} z:${(camera.rotation.z * toDeg).toFixed(0)}`;
      }
    }

    async function loadWasm() {
      await init();
      trackerHandle = new Tracker6DoFHandle(640, 480);
      console.log('WASM loaded:', version());
    }

    function initThreeJS() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 3);

      renderer = new THREE.WebGLRenderer({
        canvas: threeCanvas,
        alpha: true,
        antialias: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);

      // AR Group - this will be transformed by tracking to keep objects fixed in space
      arGroup = new THREE.Group();
      scene.add(arGroup);

      // Cube - added to arGroup so it stays fixed in world space
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshStandardMaterial({
        color: 0xff3333,
        roughness: 0.4,
        metalness: 0.3
      });
      cube = new THREE.Mesh(geometry, material);
      arGroup.add(cube);

      // Edges
      const edges = new THREE.EdgesGeometry(geometry);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff });
      cube.add(new THREE.LineSegments(edges, lineMat));

      // Lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);

      window.addEventListener('resize', onResize);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      videoCanvas.width = window.innerWidth;
      videoCanvas.height = window.innerHeight;
    }

    async function startCamera() {
      video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.muted = true;
      video.autoplay = true;

      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;

      await new Promise(r => { video.onloadedmetadata = r; });
      await video.play();

      videoCanvas.width = window.innerWidth;
      videoCanvas.height = window.innerHeight;
    }

    async function requestIMUPermission() {
      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const response = await DeviceMotionEvent.requestPermission();
          return response === 'granted';
        } catch (e) {
          return false;
        }
      }
      return true;
    }

    function setupIMU() {
      gyroDot.classList.add('warning');
      accelDot.classList.add('warning');
      calibDot.classList.add('warning');
      calibText.textContent = 'Waiting...';

      window.addEventListener('devicemotion', (e) => {
        // Handle gyroscope for IMU fusion
        handleGyro(e);

        if (e.rotationRate && (e.rotationRate.alpha !== null || e.rotationRate.beta !== null)) {
          if (!gyroActive) {
            gyroActive = true;
            gyroDot.className = 'imu-dot active';
          }
        }
        if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x !== null) {
          if (!accelActive) {
            accelActive = true;
            accelDot.className = 'imu-dot active';
          }
        }
        if ((gyroActive || accelActive) && !imuDataReceived) {
          imuDataReceived = true;
          calibDot.className = 'imu-dot warning';
          calibText.textContent = 'Calibrating...';
          setTimeout(() => {
            calibDot.className = 'imu-dot active';
            calibText.textContent = 'Fused';
          }, 2000);
        }
      });

      setTimeout(() => {
        if (!imuDataReceived) {
          gyroDot.className = 'imu-dot error';
          accelDot.className = 'imu-dot error';
          calibDot.className = 'imu-dot error';
          calibText.textContent = 'No sensors';
        }
      }, 3000);
    }

    function render() {
      if (!isRunning) return;

      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        fpsEl.textContent = frameCount;
        frameCount = 0;
        lastFpsTime = now;
      }

      // Draw video
      if (video && video.readyState >= 2) {
        const vAspect = video.videoWidth / video.videoHeight;
        const cAspect = videoCanvas.width / videoCanvas.height;
        let dw, dh, ox, oy;
        if (vAspect > cAspect) {
          dh = videoCanvas.height;
          dw = dh * vAspect;
          ox = (videoCanvas.width - dw) / 2;
          oy = 0;
        } else {
          dw = videoCanvas.width;
          dh = dw / vAspect;
          ox = 0;
          oy = (videoCanvas.height - dh) / 2;
        }
        videoCtx.drawImage(video, ox, oy, dw, dh);

        // Process frame
        if (trackerHandle) {
          const pCanvas = document.createElement('canvas');
          pCanvas.width = 640;
          pCanvas.height = 480;
          const pCtx = pCanvas.getContext('2d');
          pCtx.drawImage(video, 0, 0, 640, 480);
          const imgData = pCtx.getImageData(0, 0, 640, 480);
          const pose = trackerHandle.process_frame(imgData.data, 640, 480);
          const tracked = trackerHandle.tracked_points();

          featuresEl.textContent = tracked;

          if (pose && tracked > 10) {
            stateEl.textContent = 'tracking';
            stateEl.style.color = '#4ade80';

            const q = pose.rotation;
            const trackerQuat = new THREE.Quaternion(q[0], q[1], q[2], q[3]);
            const euler = new THREE.Euler().setFromQuaternion(trackerQuat);

            // Visual tracking provides euler angles from optical flow
            // Tracker's coordinate system:
            // - euler.x = pitch (vertical camera motion from optical flow)
            // - euler.y = yaw (horizontal camera motion)
            // - euler.z = roll
            //
            // We need to match gyro's coordinate system:
            // - visualOrientation.x = pitch (matches gyroOrientation.x from beta)
            // - visualOrientation.y = roll
            // - visualOrientation.z = yaw
            //
            // The tracker already inverts some values, so we map directly:
            visualOrientation.x += (euler.x - visualOrientation.x) * VISUAL_SMOOTHING;
            visualOrientation.y += (euler.z - visualOrientation.y) * VISUAL_SMOOTHING;
            visualOrientation.z += (euler.y - visualOrientation.z) * VISUAL_SMOOTHING;

            // If no gyro available, fall back to visual-only
            // Use same convention as gyro: direct mapping (no inversion)
            if (!gyroActive) {
              camera.rotation.x = visualOrientation.x;
              camera.rotation.y = visualOrientation.z;
              camera.rotation.z = -visualOrientation.y;
            }

            // Translation via JS-side accelerometer (gravity-free from device sensor fusion)
            jsPosition.x += jsVelocity.x * 0.02;
            jsPosition.y += jsVelocity.y * 0.02;
            jsPosition.z += jsVelocity.z * 0.02;
            jsPosition.x *= JS_POS_DECAY;
            jsPosition.y *= JS_POS_DECAY;
            jsPosition.z *= JS_POS_DECAY;
            jsPosition.x = Math.max(-JS_MAX_OFFSET, Math.min(JS_MAX_OFFSET, jsPosition.x));
            jsPosition.y = Math.max(-JS_MAX_OFFSET, Math.min(JS_MAX_OFFSET, jsPosition.y));
            jsPosition.z = Math.max(-JS_MAX_OFFSET, Math.min(JS_MAX_OFFSET, jsPosition.z));

            smoothedPosition.x += (jsPosition.x - smoothedPosition.x) * JS_SMOOTHING;
            smoothedPosition.y += (jsPosition.y - smoothedPosition.y) * JS_SMOOTHING;
            smoothedPosition.z += (jsPosition.z - smoothedPosition.z) * JS_SMOOTHING;

            camera.position.set(
              smoothedPosition.x,
              smoothedPosition.y,
              3 + smoothedPosition.z
            );
          } else {
            stateEl.textContent = tracked > 0 ? 'initializing' : 'searching';
            stateEl.style.color = tracked > 0 ? '#facc15' : '#f87171';
          }
        }
      }

      // Render
      renderer.render(scene, camera);

      animationId = requestAnimationFrame(render);
    }

    function reset() {
      if (trackerHandle) {
        trackerHandle.reset();
        if (trackerHandle.reset_accel_position) {
          trackerHandle.reset_accel_position();
        }
      }
      // Reset fusion state
      gyroOrientation = { x: 0, y: 0, z: 0 };
      visualOrientation = { x: 0, y: 0, z: 0 };
      fusedOrientation = { x: 0, y: 0, z: 0 };
      gyroInitialized = false;
      smoothedPosition.set(0, 0, 0);
      jsVelocity = { x: 0, y: 0, z: 0 };
      jsPosition = { x: 0, y: 0, z: 0 };
      camera.rotation.set(0, 0, 0);
      camera.position.set(0, 0, 3);
      cube.rotation.set(0, 0, 0);
    }

    // Start button
    startBtn.addEventListener('click', async () => {
      try {
        startBtn.disabled = true;
        startBtn.textContent = 'Loading...';

        // Request IMU first (must be in user gesture)
        await requestIMUPermission();

        await loadWasm();
        await startCamera();
        initThreeJS();
        onResize();
        setupIMU();

        startOverlay.classList.add('hidden');
        resetBtn.disabled = false;
        isRunning = true;
        lastFpsTime = performance.now();
        render();
      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
        startBtn.disabled = false;
        startBtn.textContent = 'Start AR';
      }
    });

    resetBtn.addEventListener('click', reset);
  </script>
</body>
</html>
