<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>QUAR Engine - Advanced AR Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
    }

    /* EXACT same structure as basic demo */
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #three-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* HUD Panel */
    #hud {
      position: absolute;
      top: 20px; left: 20px;
      background: rgba(0,0,0,0.7);
      padding: 15px 20px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      z-index: 100;
    }
    #hud h2 {
      color: #4cc9f0;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .stat { margin: 5px 0; }
    .stat-label { color: #888; }
    .stat-value { color: #4ade80; }

    /* IMU Panel */
    #imu-panel {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(0,0,0,0.7);
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 100;
    }
    #imu-panel h3 {
      color: #4cc9f0;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .imu-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }
    .imu-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
    }
    .imu-dot.active { background: #4ade80; }
    .imu-dot.warning { background: #facc15; }
    .imu-dot.error { background: #f87171; }

    /* Controls */
    #controls {
      position: absolute;
      bottom: 40px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    button {
      padding: 12px 25px;
      background: #4cc9f0;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
    button:disabled { background: #4b5563; cursor: not-allowed; }

    /* Start overlay */
    #start-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    #start-overlay h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }
    #start-overlay p {
      color: #888;
      margin-bottom: 30px;
    }
    #start-overlay.hidden { display: none; }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="video-canvas"></canvas>
    <canvas id="three-canvas"></canvas>

    <div id="hud">
      <h2>Advanced AR</h2>
      <div class="stat">
        <span class="stat-label">FPS: </span>
        <span class="stat-value" id="fps">--</span>
      </div>
      <div class="stat">
        <span class="stat-label">Features: </span>
        <span class="stat-value" id="features">--</span>
      </div>
      <div class="stat">
        <span class="stat-label">State: </span>
        <span class="stat-value" id="state">initializing</span>
      </div>
    </div>

    <div id="imu-panel">
      <h3>IMU Sensors</h3>
      <div class="imu-row">
        <div class="imu-dot" id="gyro-dot"></div>
        <span>Gyroscope</span>
      </div>
      <div class="imu-row">
        <div class="imu-dot" id="accel-dot"></div>
        <span>Accelerometer</span>
      </div>
      <div class="imu-row">
        <div class="imu-dot" id="calib-dot"></div>
        <span id="calib-text">Calibration</span>
      </div>
    </div>

    <div id="controls">
      <button id="reset-btn" disabled>Reset</button>
    </div>

    <div id="start-overlay">
      <h1>QUAR Engine</h1>
      <p>Advanced AR with IMU Fusion</p>
      <button id="start-btn">Start AR</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import init, { TrackerHandle, version } from './pkg/quar_engine.js';

    // DOM elements
    const videoCanvas = document.getElementById('video-canvas');
    const threeCanvas = document.getElementById('three-canvas');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const fpsEl = document.getElementById('fps');
    const featuresEl = document.getElementById('features');
    const stateEl = document.getElementById('state');
    const gyroDot = document.getElementById('gyro-dot');
    const accelDot = document.getElementById('accel-dot');
    const calibDot = document.getElementById('calib-dot');
    const calibText = document.getElementById('calib-text');

    const videoCtx = videoCanvas.getContext('2d');

    // Three.js
    let scene, camera, renderer, cube, arGroup;

    // State
    let wasmModule = null;
    let trackerHandle = null;
    let video = null;
    let stream = null;
    let animationId = null;
    let isRunning = false;

    // FPS
    let frameCount = 0;
    let lastFpsTime = 0;

    // IMU
    let imuDataReceived = false;
    let gyroActive = false;
    let accelActive = false;

    // Smoothing for tracking
    const smoothingFactor = 0.15;
    let smoothedRotation = { roll: 0, pitch: 0, yaw: 0 };

    // Convert quaternion to euler angles
    function quaternionToEuler(qx, qy, qz, qw) {
      const sinr_cosp = 2 * (qw * qx + qy * qz);
      const cosr_cosp = 1 - 2 * (qx * qx + qy * qy);
      const roll = Math.atan2(sinr_cosp, cosr_cosp);

      const sinp = 2 * (qw * qy - qz * qx);
      const pitch = Math.abs(sinp) >= 1 ? Math.sign(sinp) * Math.PI / 2 : Math.asin(sinp);

      const siny_cosp = 2 * (qw * qz + qx * qy);
      const cosy_cosp = 1 - 2 * (qy * qy + qz * qz);
      const yaw = Math.atan2(siny_cosp, cosy_cosp);

      return { roll, pitch, yaw };
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    async function loadWasm() {
      await init();
      trackerHandle = new TrackerHandle();
      console.log('WASM loaded:', version());
    }

    function initThreeJS() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 3);

      renderer = new THREE.WebGLRenderer({
        canvas: threeCanvas,
        alpha: true,
        antialias: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);

      // AR Group - this will be transformed by tracking to keep objects fixed in space
      arGroup = new THREE.Group();
      scene.add(arGroup);

      // Cube - added to arGroup so it stays fixed in world space
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshStandardMaterial({
        color: 0xff3333,
        roughness: 0.4,
        metalness: 0.3
      });
      cube = new THREE.Mesh(geometry, material);
      arGroup.add(cube);

      // Edges
      const edges = new THREE.EdgesGeometry(geometry);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff });
      cube.add(new THREE.LineSegments(edges, lineMat));

      // Lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);

      window.addEventListener('resize', onResize);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      videoCanvas.width = window.innerWidth;
      videoCanvas.height = window.innerHeight;
    }

    async function startCamera() {
      video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.muted = true;
      video.autoplay = true;

      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;

      await new Promise(r => { video.onloadedmetadata = r; });
      await video.play();

      videoCanvas.width = window.innerWidth;
      videoCanvas.height = window.innerHeight;
    }

    async function requestIMUPermission() {
      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const response = await DeviceMotionEvent.requestPermission();
          return response === 'granted';
        } catch (e) {
          return false;
        }
      }
      return true;
    }

    function setupIMU() {
      gyroDot.classList.add('warning');
      accelDot.classList.add('warning');
      calibDot.classList.add('warning');
      calibText.textContent = 'Waiting...';

      window.addEventListener('devicemotion', (e) => {
        if (e.rotationRate && (e.rotationRate.alpha !== null || e.rotationRate.beta !== null)) {
          if (!gyroActive) {
            gyroActive = true;
            gyroDot.className = 'imu-dot active';
          }
        }
        if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x !== null) {
          if (!accelActive) {
            accelActive = true;
            accelDot.className = 'imu-dot active';
          }
        }
        if ((gyroActive || accelActive) && !imuDataReceived) {
          imuDataReceived = true;
          calibDot.className = 'imu-dot warning';
          calibText.textContent = 'Calibrating...';
          setTimeout(() => {
            calibDot.className = 'imu-dot active';
            calibText.textContent = 'Calibrated';
          }, 2000);
        }
      });

      setTimeout(() => {
        if (!imuDataReceived) {
          gyroDot.className = 'imu-dot error';
          accelDot.className = 'imu-dot error';
          calibDot.className = 'imu-dot error';
          calibText.textContent = 'No sensors';
        }
      }, 3000);
    }

    function render() {
      if (!isRunning) return;

      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        fpsEl.textContent = frameCount;
        frameCount = 0;
        lastFpsTime = now;
      }

      // Draw video
      if (video && video.readyState >= 2) {
        const vAspect = video.videoWidth / video.videoHeight;
        const cAspect = videoCanvas.width / videoCanvas.height;
        let dw, dh, ox, oy;
        if (vAspect > cAspect) {
          dh = videoCanvas.height;
          dw = dh * vAspect;
          ox = (videoCanvas.width - dw) / 2;
          oy = 0;
        } else {
          dw = videoCanvas.width;
          dh = dw / vAspect;
          ox = 0;
          oy = (videoCanvas.height - dh) / 2;
        }
        videoCtx.drawImage(video, ox, oy, dw, dh);

        // Process frame
        if (trackerHandle) {
          const pCanvas = document.createElement('canvas');
          pCanvas.width = 640;
          pCanvas.height = 480;
          const pCtx = pCanvas.getContext('2d');
          pCtx.drawImage(video, 0, 0, 640, 480);
          const imgData = pCtx.getImageData(0, 0, 640, 480);
          const pose = trackerHandle.process_frame(imgData.data, 640, 480);
          const tracked = trackerHandle.tracked_points();

          featuresEl.textContent = tracked;

          if (pose && tracked > 10) {
            stateEl.textContent = 'tracking';
            stateEl.style.color = '#4ade80';

            // Convert quaternion to euler angles
            const q = pose.rotation;
            const euler = quaternionToEuler(q[0], q[1], q[2], q[3]);

            // Apply smoothing
            smoothedRotation.roll = lerp(smoothedRotation.roll, euler.roll, smoothingFactor);
            smoothedRotation.pitch = lerp(smoothedRotation.pitch, euler.pitch, smoothingFactor);
            smoothedRotation.yaw = lerp(smoothedRotation.yaw, euler.yaw, smoothingFactor);

            // Apply rotation to Three.js camera to match phone orientation
            // Using only pitch (vertical) and yaw (horizontal), disable roll
            const sensitivity = 0.7; // 30% less sensitive
            camera.rotation.x = smoothedRotation.pitch * sensitivity;  // tilt up/down
            camera.rotation.y = smoothedRotation.yaw * sensitivity;    // rotate left/right
            camera.rotation.z = 0; // disable roll - causes interference
          } else {
            stateEl.textContent = tracked > 0 ? 'initializing' : 'searching';
            stateEl.style.color = tracked > 0 ? '#facc15' : '#f87171';
          }
        }
      }

      // Cube rotates slowly on its own axis (decorative)
      cube.rotation.y += 0.005;

      // Render
      renderer.render(scene, camera);

      animationId = requestAnimationFrame(render);
    }

    function reset() {
      if (trackerHandle) trackerHandle.reset();
      arGroup.quaternion.set(0, 0, 0, 1);
      cube.rotation.set(0, 0, 0);
    }

    // Start button
    startBtn.addEventListener('click', async () => {
      try {
        startBtn.disabled = true;
        startBtn.textContent = 'Loading...';

        // Request IMU first (must be in user gesture)
        await requestIMUPermission();

        await loadWasm();
        await startCamera();
        initThreeJS();
        onResize();
        setupIMU();

        startOverlay.classList.add('hidden');
        resetBtn.disabled = false;
        isRunning = true;
        lastFpsTime = performance.now();
        render();
      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
        startBtn.disabled = false;
        startBtn.textContent = 'Start AR';
      }
    });

    resetBtn.addEventListener('click', reset);
  </script>
</body>
</html>
