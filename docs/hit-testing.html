<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUAR Engine - Hit Testing Example</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video-canvas, #three-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #three-canvas { pointer-events: none; }
    #hud {
      position: absolute;
      top: 20px; left: 20px;
      background: rgba(0,0,0,0.85);
      padding: 15px 20px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      z-index: 100;
      min-width: 200px;
    }
    #hud h3 { color: #60a5fa; margin-bottom: 10px; }
    .stat { margin: 4px 0; }
    .label { color: #888; }
    .value { color: #4ade80; }
    #status {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      z-index: 100;
    }
    #status.hidden { display: none; }
    .hidden { display: none; }
    button {
      margin-top: 15px;
      padding: 12px 30px;
      background: #60a5fa;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #3b82f6; }
    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 50;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.5);
    }
    #crosshair::before {
      width: 2px; height: 8px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    #crosshair::after {
      width: 8px; height: 2px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    #instructions {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 12px 20px;
      border-radius: 8px;
      text-align: center;
      z-index: 100;
    }
    #place-btn {
      margin-top: 10px;
      padding: 10px 20px;
      background: #4ade80;
    }
    #place-btn:hover { background: #22c55e; }
    #place-btn:disabled { background: #4b5563; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="video-canvas"></canvas>
    <canvas id="three-canvas"></canvas>
    <div id="crosshair"></div>

    <div id="hud">
      <h3>Hit Testing</h3>
      <div class="stat"><span class="label">Planes: </span><span id="planes" class="value">0</span></div>
      <div class="stat"><span class="label">Hit: </span><span id="hit-status" class="value">--</span></div>
      <div class="stat"><span class="label">Distance: </span><span id="hit-dist" class="value">--</span></div>
      <div class="stat"><span class="label">Objects: </span><span id="objects" class="value">0</span></div>
    </div>

    <div id="instructions" class="hidden">
      <p>Point at a surface and tap to place</p>
      <button id="place-btn" disabled>Place Object</button>
    </div>

    <div id="status">
      <p>Hit Testing Example</p>
      <p style="color: #888; margin-top: 10px;">Demonstrates plane detection and object placement</p>
      <button id="start-btn">Start AR</button>
    </div>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

  <script type="module">
    // DOM elements
    const videoCanvas = document.getElementById('video-canvas');
    const threeCanvas = document.getElementById('three-canvas');
    const statusEl = document.getElementById('status');
    const instructionsEl = document.getElementById('instructions');
    const startBtn = document.getElementById('start-btn');
    const placeBtn = document.getElementById('place-btn');
    const planesEl = document.getElementById('planes');
    const hitStatusEl = document.getElementById('hit-status');
    const hitDistEl = document.getElementById('hit-dist');
    const objectsEl = document.getElementById('objects');

    // State
    let Tracker6DoFHandle = null;
    let tracker = null;
    let video = null;
    let videoCtx = null;
    let scene, camera, renderer;
    let reticle, raycaster;
    let placedObjects = [];
    let planes = [];
    let isRunning = false;
    let canPlace = false;

    // Attach button handlers immediately (don't wait for WASM)
    startBtn.addEventListener('click', startAR);
    placeBtn.addEventListener('click', placeObject);

    function setupThreeJS() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);

      renderer = new THREE.WebGLRenderer({
        canvas: threeCanvas,
        alpha: true,
        antialias: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      // Placement reticle
      const reticleGeom = new THREE.RingGeometry(0.05, 0.06, 32);
      reticleGeom.rotateX(-Math.PI / 2);
      const reticleMat = new THREE.MeshBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.8 });
      reticle = new THREE.Mesh(reticleGeom, reticleMat);
      reticle.visible = false;
      scene.add(reticle);

      // Raycaster for hit testing
      raycaster = new THREE.Raycaster();

      // Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(1, 2, 1);
      scene.add(dirLight);

      // Simulated floor plane for demo
      const floorGeom = new THREE.PlaneGeometry(10, 10);
      const floorMat = new THREE.MeshBasicMaterial({ visible: false });
      const floor = new THREE.Mesh(floorGeom, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.5; // 50cm below camera
      floor.userData.isPlane = true;
      scene.add(floor);
      planes.push(floor);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    async function startAR() {
      try {
        startBtn.disabled = true;
        startBtn.textContent = 'Loading...';

        // Load WASM dynamically
        const wasm = await import('./pkg/quar_engine.js');
        await wasm.default();
        Tracker6DoFHandle = wasm.Tracker6DoFHandle;
        console.log('QUAR Engine:', wasm.version());

        // Setup Three.js
        setupThreeJS();

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });

        video = document.createElement('video');
        video.srcObject = stream;
        video.setAttribute('playsinline', '');
        await video.play();

        videoCanvas.width = video.videoWidth;
        videoCanvas.height = video.videoHeight;
        videoCtx = videoCanvas.getContext('2d');

        tracker = new Tracker6DoFHandle(video.videoWidth, video.videoHeight);

        statusEl.classList.add('hidden');
        instructionsEl.classList.remove('hidden');
        isRunning = true;

        requestAnimationFrame(trackingLoop);
      } catch (err) {
        console.error('Failed to start:', err);
        startBtn.disabled = false;
        startBtn.textContent = 'Start AR';
        alert('Failed: ' + err.message);
      }
    }

    function trackingLoop() {
      if (!isRunning) return;

      videoCtx.drawImage(video, 0, 0);
      const imageData = videoCtx.getImageData(0, 0, videoCanvas.width, videoCanvas.height);
      const pose = tracker.process_frame(imageData.data, videoCanvas.width, videoCanvas.height);

      if (pose) {
        // Apply camera pose
        const [qx, qy, qz, qw] = pose.rotation;
        const [tx, ty, tz] = pose.translation;
        camera.quaternion.set(qx, -qy, -qz, qw);
        camera.position.set(tx, -ty, -tz);
      }

      // Hit test from center of screen
      performHitTest();

      // Update HUD
      planesEl.textContent = planes.length;
      objectsEl.textContent = placedObjects.length;

      renderer.render(scene, camera);
      requestAnimationFrame(trackingLoop);
    }

    function performHitTest() {
      // Ray from center of screen
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      // Test against planes
      const hits = raycaster.intersectObjects(planes);

      if (hits.length > 0) {
        const hit = hits[0];
        reticle.visible = true;
        reticle.position.copy(hit.point);

        // Orient reticle to plane normal
        const normal = hit.face.normal.clone();
        normal.transformDirection(hit.object.matrixWorld);
        reticle.lookAt(hit.point.clone().add(normal));

        hitStatusEl.textContent = 'Yes';
        hitStatusEl.style.color = '#4ade80';
        hitDistEl.textContent = hit.distance.toFixed(2) + 'm';

        canPlace = true;
        placeBtn.disabled = false;
      } else {
        reticle.visible = false;
        hitStatusEl.textContent = 'No';
        hitStatusEl.style.color = '#ef4444';
        hitDistEl.textContent = '--';
        canPlace = false;
        placeBtn.disabled = true;
      }
    }

    function placeObject() {
      if (!canPlace || !reticle.visible) return;

      // Create a random colored cube
      const size = 0.05 + Math.random() * 0.05;
      const geometry = new THREE.BoxGeometry(size, size, size);
      const material = new THREE.MeshStandardMaterial({
        color: Math.random() * 0xffffff,
        roughness: 0.5,
        metalness: 0.2
      });
      const cube = new THREE.Mesh(geometry, material);

      // Position at reticle location, raised by half height
      cube.position.copy(reticle.position);
      cube.position.y += size / 2;

      scene.add(cube);
      placedObjects.push(cube);

      // Brief pulse feedback
      reticle.scale.set(1.5, 1.5, 1.5);
      setTimeout(() => reticle.scale.set(1, 1, 1), 100);
    }

  </script>
</body>
</html>
