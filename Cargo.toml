[package]
name = "quar-engine"
version = "0.1.0"
edition = "2021"
authors = ["QUAR Team"]
description = "WebAR SLAM engine targeting 60FPS markerless 6DoF tracking in the browser"
license = "MIT"
repository = "https://github.com/FunwayHQ/quar_engine"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
profiling = []

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "console",
    "Performance",
    "PerformanceTiming",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
criterion = "0.5"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[[bench]]
name = "benchmarks"
harness = false
